trigger:
- main

jobs:
# --- PHASE 1: BUILD THE APPLICATION ---
- job: BuildApp
  strategy:
    matrix:
      windows:
        imageName: 'windows-latest'
        isWindows: 'true'
        scriptRun: |
          npm install
          if (Test-Path "node_modules\electron-winstaller\vendor\7z_x64.dll") { Rename-Item -Path "node_modules\electron-winstaller\vendor\7z_x64.dll" -NewName "7z.dll" -Force }
          if (Test-Path "node_modules\electron-winstaller\vendor\7z_x64.exe") { Rename-Item -Path "node_modules\electron-winstaller\vendor\7z_x64.exe" -NewName "7z.exe" -Force }
          if (Test-Path "package-lock.json") { Remove-Item -Path "package-lock.json" -Force }
          npm run make -- --skip-signing
      linux:
        imageName: 'ubuntu-latest'
        isWindows: 'false'
        scriptRun: |
          npm install
          rm -f package-lock.json
          npm run make
    maxParallel: 1

  pool:
    vmImage: $(imageName)

  steps:
  # Upgraded to 22.x to properly align with your Electron framework engine requirements
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: 'Install Node.js'

  # Run on Windows agents using PowerShell Core (handles multiline variables safely)
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: $(scriptRun)
      pwsh: true
    displayName: 'npm install and build (Windows)'
    condition: eq(variables['isWindows'], 'true')

  # Run on Linux agents using Bash
  - task: Bash@3
    inputs:
      targetType: 'inline'
      script: $(scriptRun)
    displayName: 'npm install and build (Linux)'
    condition: eq(variables['isWindows'], 'false')

  # Stash the entire 'out/make' directory
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/out/make'
      artifact: 'build-output-$(Agent.JobName)'
    displayName: 'Upload binaries to pipeline storage'


# --- PHASE 2: PUBLISH TO GITHUB ---
- job: PublishToGitHub
  dependsOn: BuildApp
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      path: '$(Pipeline.Workspace)/artifacts'

  # Create the GitHub Release and filter specific contents
  - task: GitHubRelease@1
    inputs:
      gitHubConnection: 'Basito0'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: 'v$(Build.BuildId)'
      title: 'Release v$(Build.BuildId)'
      changeLogCompareToRelease: 'lastFullRelease'
      changeLogType: 'commitBased'
      
      # Visual Matchers:
      # Line 1: Grab all contents inside deb/x64, rpm/x64, and zip/linux/x64
      # Line 2: Explicitly grab ONLY the .exe files from squirrel.windows/x64
      assets: |
        $(Pipeline.Workspace)/artifacts/**/@(deb|rpm)/x64/*
        $(Pipeline.Workspace)/artifacts/**/zip/linux/x64/*
        $(Pipeline.Workspace)/artifacts/**/squirrel.windows/x64/*.exe
    displayName: 'Filter assets and upload to GitHub Release'
