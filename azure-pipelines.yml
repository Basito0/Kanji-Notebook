trigger:
- main

jobs:
# --- PHASE 1: BUILD THE APPLICATION ---
- job: BuildApp
  strategy:
    matrix:
      windows:
        imageName: 'windows-latest'
        # Split into a list of commands natively supported by PowerShell Core (pwsh)
        scriptRun: |
          npm install
          if (Test-Path "node_modules\electron-winstaller\vendor\7z_x64.dll") { Rename-Item -Path "node_modules\electron-winstaller\vendor\7z_x64.dll" -NewName "7z.dll" -Force }
          if (Test-Path "node_modules\electron-winstaller\vendor\7z_x64.exe") { Rename-Item -Path "node_modules\electron-winstaller\vendor\7z_x64.exe" -NewName "7z.exe" -Force }
          if (Test-Path "package-lock.json") { Remove-Item -Path "package-lock.json" -Force }
          npm run make
          Get-ChildItem -Recurse
        isWindows: true
      linux:
        imageName: 'ubuntu-latest'
        scriptRun: |
          npm install
          rm -f package-lock.json
          npm run make
        isWindows: false
    maxParallel: 1

  pool:
    vmImage: $(imageName)

  steps:
  # Upgraded to 22.x to safely meet the required engine demands of Electron v44
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: 'Install Node.js'

  # Conditional Step: Runs on Windows using PowerShell Core
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: $(scriptRun)
    displayName: 'npm install and build (Windows)'
    condition: eq(variables['isWindows'], 'true')

  # Conditional Step: Runs on Linux using Bash
  - task: Bash@3
    inputs:
      targetType: 'inline'
      script: $(scriptRun)
    displayName: 'npm install and build (Linux)'
    condition: ne(variables['isWindows'], 'false')

  # Stash the entire directory using wildcards to handle varying output paths
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/out'
      artifact: 'build-output-$(Agent.JobName)'
    displayName: 'Upload binaries to pipeline storage'


# --- PHASE 2: PUBLISH TO GITHUB ---
- job: PublishToGitHub
  dependsOn: BuildApp
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      path: '$(Pipeline.Workspace)/artifacts'

  # Create the GitHub Release and filter specific contents
  - task: GitHubRelease@1
    inputs:
      gitHubConnection: 'Basito0'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: 'v$(Build.BuildId)'
      title: 'Release v$(Build.BuildId)'
      changeLogCompareToRelease: 'lastFullRelease'
      changeLogType: 'commitBased'
      
      # Adjusted the pattern to match files since we captured $(System.DefaultWorkingDirectory)/out
      assets: |
        $(Pipeline.Workspace)/artifacts/**/make/@(deb|rpm)/x64/*
        $(Pipeline.Workspace)/artifacts/**/make/zip/linux/x64/*
        $(Pipeline.Workspace)/artifacts/**/make/squirrel.windows/x64/*.exe
    displayName: 'Filter assets and upload to GitHub Release'
